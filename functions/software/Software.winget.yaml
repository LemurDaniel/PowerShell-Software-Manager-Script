id: winget
displayName: Winget Software
description: Windows Package Manager (winget) software management

process:
  path: pwsh
  args:
    - -NoProfile
    - -NonInteractive
    - -Command

  commands:
    install:
      - Install-WinGetPackage -Id ${id} -Verbose

    update:
      - Update-WinGetPackage -Id ${id} -Verbose

    deinstall:
      - Uninstall-WinGetPackage -Id ${id} -Verbose

    list:
      - |
        Get-WinGetPackage 
        | Where-Object -Property ID -Match "^.*\.+.*"
        | ForEach-Object {
            [PSCustomObject]@{
                id      = $_.Id
                version = $_.InstalledVersion
            }
        }
        | ConvertTo-Json -Depth 3

